name: ownCloud CI

on:
  push:
    branches:
      - master
      - '[0-9]+'
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: 'Windows-Pakete mit dem DigiCert-Zertifikat signieren (nur fuer Release-Baeume)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
# ------------------------------------------------------------------------------------------------------------------------------------------
  build:
    permissions:
      # actions/upload-artifact doesn't need contents: write
      contents: read
    strategy:
        fail-fast: false
        matrix:
            include:
            - name: windows-cl-x86_64
              target: windows-cl-msvc2022-x86_64
              os: windows-2022
              container:
              useSonarCloud: ${{ github.event_name != 'pull_request' }}
              testOptions: --options '[Compile]Jobs=1'
            # TODO: align the target with the name
            # macOS: Build + Tests + Packaging (dmg, siehe Package-Step:
            # APPLICATION_EXECUTABLE-Export) laufen; das dmg wird von
            # publish-release.yml mit veroeffentlicht. FileProvider-VFS ist
            # weiterhin in Arbeit (docs/mac-vfs-implementation-plan.md).
            # continueOnError bleibt vorerst, damit ein Mac-Packaging-Fehler
            # die Windows/Linux-Releases nicht blockiert.
            - name: macos-clang-arm64
              target: macos-clang-arm64
              os: macos-15
              container:
              useSonarCloud:
              testOptions:
              continueOnError: true
            - name: linux-gcc-x86_64
              target: linux-64-gcc
              os: ubuntu-latest
              container: owncloudci/appimage-build:sles15-amd64
              useSonarCloud:
              testOptions:
    name: ${{ matrix.name }}
    #let the other builds run even if one fails
    #continue-on-error: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continueOnError || false }}

    env:
      CRAFT_TARGET: ${{ matrix.target }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Windows-Code-Signierung nur, wenn die DigiCert-Zugangsdaten hinterlegt sind
      # (Repository-Secrets und -Variable, siehe admin/win/CODESIGNING.md).
      HAS_SIGNING: ${{ secrets.SM_API_KEY != '' && secrets.SM_CLIENT_CERT_FILE_B64 != '' && secrets.SM_CLIENT_CERT_PASSWORD != '' && vars.SM_HOST != '' }}

    container: ${{ matrix.container }}

    steps:
    - name: Check out full source code for tooling
      if: ${{ matrix.useSonarCloud || matrix.name  == 'linux-gcc-x86_64' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Check out latest commit
      if: ${{ !matrix.useSonarCloud && matrix.name  != 'linux-gcc-x86_64' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      if: matrix.name  == 'windows-cl-x86_64'
      with:
        python-version: '3.12'

    - name: Restore cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/cache
        key: ${{ runner.os }}-${{ matrix.target }}

    - name: Clone CraftMaster
      run: git clone --depth=1 https://github.com/KDE/craftmaster.git "$env:HOME/craft/CraftMaster/CraftMaster"

    - name: Craft setup
      run: |
        New-Item -Path ~/cache -ItemType Directory -ErrorAction SilentlyContinue
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" --setup

    - name: Craft unshelve
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --unshelve "${env:GITHUB_WORKSPACE}/.craft.shelf"

    - name: Prepare
      run: |
        New-Item -ItemType Directory "${env:GITHUB_WORKSPACE}/binaries/"
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set forceAsserts=true owncloud/owncloud-client
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set srcDir="${env:GITHUB_WORKSPACE}" owncloud/owncloud-client
        if ($IsWindows) {
            & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c dev-utils/nsis
        } elseif($IsLinux) {
            & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c dev-utils/linuxdeploy
        }

    - name: Install dependencies
      run: |
          if ("${{ matrix.target }}" -eq "linux-64-gcc" ) {
              # build with appimage updater and others
              & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set enableAppImageUpdater=true owncloud-client
              & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set enableCrashReporter=true owncloud/owncloud-client
              & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set enableAutoUpdater=true owncloud/owncloud-client
          }
          & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --install-deps owncloud/owncloud-client

    - name: QML format lint
      if: matrix.name  == 'linux-gcc-x86_64'
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c libs/qt6/qttools
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --run pwsh -c "git ls-files *.qml | %{ qmlformat -i `$_}"
        $diff = git diff
        if ($diff) {
          $diff
          exit 1
        }

    - name: clang-format format lint
      if: matrix.name  == 'linux-gcc-x86_64' && github.event_name == 'pull_request'
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c libs/llvm
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --run git clang-format --force  ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        $diff = git diff
        if ($diff) {
          $diff
          exit 1
        }

    - name: Build
      if: ${{ !matrix.useSonarCloud }}
      run: |
        if ("${{ matrix.target }}" -eq "macos-64-clang-debug" ) {
            # https://api.kde.org/ecm/module/ECMEnableSanitizers.html
            # address;leak;undefined
            # clang: error: unsupported option '-fsanitize=leak' for target 'x86_64-apple-darwin21.6.0'
            & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set args="-DECM_ENABLE_SANITIZERS='address;undefined'" owncloud/owncloud-client
        }
        if ("${{ matrix.target }}" -eq "linux-64-gcc" ) {
            # build with appimage updater and others
            & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set enableAppImageUpdater=true owncloud-client
            & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set enableCrashReporter=true owncloud/owncloud-client
            & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set enableAutoUpdater=true owncloud/owncloud-client
        }
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache owncloud/owncloud-client

    - name: Build for SonarCloud
      if: ${{ matrix.useSonarCloud }}
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache --configure owncloud/owncloud-client
        $env:BUILD_DIR = $(& "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --get buildDir -q owncloud-client)
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --run pwsh "${env:GITHUB_WORKSPACE}/.github/workflows/.sonar.ps1" --build
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache --install --qmerge owncloud/owncloud-client
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --run pwsh "${env:GITHUB_WORKSPACE}/.github/workflows/.sonar.ps1" --analyze

    - name: Run tests
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache --test ${{ matrix.testOptions }} owncloud/owncloud-client

    # Windows-Code-Signierung mit DigiCert KeyLocker: der private Schluessel bleibt
    # im Cloud-HSM von DigiCert, signtool spricht ueber den DigiCert-KSP. Nach
    # `smctl windows certsync` liegt das Zertifikat im Benutzerspeicher. Signiert
    # wird ausdruecklich in eigenen Schritten (admin/win/codesign.ps1): die eigenen
    # Binaerdateien im craft-Image vor dem Paketieren, danach craft-Installer,
    # Helfer und Setup-Wrapper. craft selbst signiert nicht (SIGN_PACKAGE bleibt
    # aus; sein Signier-Haken griff im Probelauf nicht).
    # Signiert wird NUR in einem von Hand gestarteten Lauf mit dem Eingabefeld
    # "sign" (Release-Bau): das Repository ist oeffentlich, die Zugangsdaten
    # sollen so selten wie moeglich in einem Lauf liegen, und das Kontingent
    # (1000 Signaturen im Jahr) reicht nicht fuer jeden Push. Pushes und Pull
    # Requests bleiben unsigniert; "Check Windows signatures" meldet das.
    - name: Code signing setup (DigiCert KeyLocker)
      if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.sign == true && env.HAS_SIGNING == 'true'
      env:
        SM_HOST: ${{ vars.SM_HOST }}
        SM_API_KEY: ${{ secrets.SM_API_KEY }}
        SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
        SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
        SM_KEYPAIR_ALIAS: ${{ vars.SM_KEYPAIR_ALIAS }}
        SM_CERT_COMMONNAME: ${{ vars.SM_CERT_COMMONNAME || 'BW-TECH GmbH' }}
      run: |
        $p12 = Join-Path $env:RUNNER_TEMP 'sm_client.p12'
        [IO.File]::WriteAllBytes($p12, [Convert]::FromBase64String($env:SM_CLIENT_CERT_FILE_B64))
        $env:SM_CLIENT_CERT_FILE = $p12

        # Client-Werkzeuge (smctl + KSP) vom DigiCert-ONE-Portal des gewaehlten Endpunkts
        $portal = $env:SM_HOST -replace '^https://clientauth\.', 'https://'
        $msi = Join-Path $env:RUNNER_TEMP 'Keylockertools-windows-x64.msi'
        curl.exe -fsS -H "x-api-key:$env:SM_API_KEY" -o $msi "$portal/signingmanager/api-ui/v1/releases/Keylockertools-windows-x64.msi/download"
        if ($LASTEXITCODE -ne 0) { throw 'Download der DigiCert Keylocker Tools fehlgeschlagen' }
        $msiexec = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/quiet', '/qn') -Wait -PassThru -NoNewWindow
        if ($msiexec.ExitCode -ne 0) { throw "Installation der Keylocker Tools: Exit-Code $($msiexec.ExitCode)" }
        $tools = 'C:\Program Files\DigiCert\DigiCert Keylocker Tools'
        $smctl = Join-Path $tools 'smctl.exe'
        & $smctl healthcheck
        Write-Host "smctl healthcheck Exit-Code: $LASTEXITCODE"

        # Zertifikat in den Benutzerspeicher holen, Schluessel bleibt bei DigiCert
        $sync = @('windows', 'certsync')
        if ($env:SM_KEYPAIR_ALIAS) { $sync += "--keypair-alias=$env:SM_KEYPAIR_ALIAS" }
        & $smctl @sync
        if ($LASTEXITCODE -ne 0) { throw 'smctl windows certsync fehlgeschlagen' }

        # fuer die folgenden Schritte: Binaerdateien, Wrapper-Bau, Pruefung
        $tools >> $env:GITHUB_PATH
        "SM_HOST=$env:SM_HOST" >> $env:GITHUB_ENV
        "SM_API_KEY=$env:SM_API_KEY" >> $env:GITHUB_ENV
        "SM_CLIENT_CERT_FILE=$p12" >> $env:GITHUB_ENV
        "SM_CLIENT_CERT_PASSWORD=$env:SM_CLIENT_CERT_PASSWORD" >> $env:GITHUB_ENV
        "CODESIGN_ACTIVE=true" >> $env:GITHUB_ENV
        "CRAFT_CODESIGN_COMMONNAME=$env:SM_CERT_COMMONNAME" >> $env:GITHUB_ENV

    # Eigene Binaerdateien (exe/dll im craft-Image des Clients, nicht die Qt-DLLs)
    # signieren, bevor craft Installer und 7z daraus baut.
    - name: Sign Windows binaries
      if: runner.os == 'Windows' && env.CODESIGN_ACTIVE == 'true'
      run: |
        $image = (& "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --get imageDir -q owncloud/owncloud-client | Select-Object -Last 1)
        if ($image) { $image = "$image".Trim() }
        if (-not $image -or -not (Test-Path $image)) {
          $image = (Get-ChildItem "$env:HOME/craft/*/build/owncloud/owncloud-client/image-*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
        }
        if (-not $image -or -not (Test-Path $image)) { throw 'Image-Verzeichnis des Clients nicht gefunden' }
        $files = @(Get-ChildItem $image -Recurse -Include *.exe, *.dll | ForEach-Object { $_.FullName })
        Write-Host "Image: $image - $($files.Count) Binaerdateien"
        if (-not $files) { throw 'Keine Binaerdateien im Image' }
        & "${env:GITHUB_WORKSPACE}/admin/win/codesign.ps1" -Sign $files

    - name: Package
      run: |
        if ("${{ matrix.target }}" -eq "linux-64-gcc" ) {
            # package without crash reporter
            & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set enableCrashReporter=false owncloud/owncloud-client
        }
        if ($IsMacOS) {
            # The craft blueprint (craft-blueprints-owncloud, owncloud-client.py)
            # derives defines["apppath"] = Applications/KDE/<APPLICATION_EXECUTABLE>.app
            # from these env vars, falling back to "owncloud". Our branded bundle
            # is owncloud.online.app - without them the packager assembles a bogus
            # owncloud.app and fails the absolute-library-path check.
            $env:APPLICATION_EXECUTABLE = "owncloud.online"
            $env:APPLICATION_SHORTNAME  = "owncloud.online"
        }
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache --package owncloud/owncloud-client

    - name: Prepare artifacts
      run: |
        Copy-Item "$env:HOME/craft/binaries/*" "${env:GITHUB_WORKSPACE}/binaries/" -ErrorAction SilentlyContinue
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --shelve "${env:GITHUB_WORKSPACE}/.craft.shelf"
        Copy-Item "${env:GITHUB_WORKSPACE}/.craft.shelf" "${env:GITHUB_WORKSPACE}/binaries/"

    # Wraps the craft installer into a setup exe that stops a running client,
    # installs silently and requires + performs the Windows restart needed for
    # the Explorer integration (see admin/win/restart-wrapper.nsi).
    - name: Build Windows setup wrapper
      if: runner.os == 'Windows'
      run: |
        $exe = Get-ChildItem "${env:GITHUB_WORKSPACE}/binaries" -Filter "*.exe" | Where-Object { $_.Name -notlike "*-Setup*" } | Select-Object -First 1
        if (-not $exe) { Write-Host "No installer exe in binaries/, skipping wrapper"; exit 0 }
        $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
        if (-not $makensis) {
          choco install nsis -y --no-progress
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
        }
        $content = Get-Content "${env:GITHUB_WORKSPACE}/VERSION.cmake" -Raw
        $maj = [regex]::Match($content, 'MIRALL_VERSION_MAJOR (\d+)').Groups[1].Value
        $min = [regex]::Match($content, 'MIRALL_VERSION_MINOR (\d+)').Groups[1].Value
        $pat = [regex]::Match($content, 'MIRALL_VERSION_PATCH (\d+)').Groups[1].Value
        $version = "$maj.$min.$pat"
        $out = "${env:GITHUB_WORKSPACE}/binaries/$($exe.BaseName)-Setup.exe"
        Set-Location "${env:GITHUB_WORKSPACE}/admin/win"
        $helper = "${env:RUNNER_TEMP}\owncloud.online-uninstall.exe"
        $codesign = "${env:GITHUB_WORKSPACE}/admin/win/codesign.ps1"
        # craft-Installer signieren, bevor er als client-setup.exe eingebettet wird
        if ($env:CODESIGN_ACTIVE -eq 'true') { & $codesign -Sign $exe.FullName }
        & $makensis "/DOUTFILE=$helper" "/DVERSION=$version" uninstall-helper.nsi
        if ($LASTEXITCODE -ne 0) { exit 1 }
        # Helfer signieren, bevor er in das Setup eingebettet wird
        if ($env:CODESIGN_ACTIVE -eq 'true') { & $codesign -Sign $helper }
        & $makensis "/DSOURCE_EXE=$($exe.FullName)" "/DOUTFILE=$out" "/DVERSION=$version" "/DUNINSTALL_HELPER_EXE=$helper" restart-wrapper.nsi
        if ($LASTEXITCODE -ne 0) { exit 1 }
        if ($env:CODESIGN_ACTIVE -eq 'true') { & $codesign -Sign $out }
        Get-ChildItem "${env:GITHUB_WORKSPACE}/binaries"

    # Pflichtschritt nach dem Signieren: jedes ausgelieferte Windows-Programm muss
    # eine gueltige Authenticode-Signatur mit Zeitstempel tragen.
    - name: Check Windows signatures
      if: runner.os == 'Windows'
      run: |
        $exes = @(Get-ChildItem "${env:GITHUB_WORKSPACE}/binaries" -Filter "*.exe")
        if ($env:CODESIGN_ACTIVE -ne 'true') {
          Write-Host "::notice::Windows-Pakete sind unsigniert - kein Signier-Lauf (siehe admin/win/CODESIGNING.md)."
          exit 0
        }
        if (-not $exes) { throw 'Keine exe in binaries/ gefunden' }
        $codesign = "${env:GITHUB_WORKSPACE}/admin/win/codesign.ps1"
        & $codesign -Verify ($exes | ForEach-Object { $_.FullName })
        # Auch der Inhalt des portablen 7z: eigene Binaerdateien muessen signiert sein
        $sevenZip = Get-ChildItem "${env:GITHUB_WORKSPACE}/binaries" -Filter "*.7z" | Select-Object -First 1
        if ($sevenZip) {
          $dir = Join-Path $env:RUNNER_TEMP 'portable-check'
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          & 7z x -y "-o$dir" $sevenZip.FullName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z konnte $($sevenZip.Name) nicht entpacken" }
          $own = @(Get-ChildItem $dir -Recurse -Include owncloud*.exe, owncloud*.dll, ownCloud*.dll | ForEach-Object { $_.FullName })
          Write-Host "Portabel: $($own.Count) eigene Binaerdateien werden geprueft"
          if (-not $own) { throw 'Keine eigenen Binaerdateien im 7z gefunden' }
          & $codesign -Verify $own
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
        }

    - name: Code signing cleanup
      if: always() && runner.os == 'Windows'
      run: Remove-Item (Join-Path $env:RUNNER_TEMP 'sm_client.p12') -Force -ErrorAction SilentlyContinue

    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ matrix.name }}
        path: ${{ github.workspace }}/binaries/*
