name: Publish Release

# Publishes a GitHub release (creating the tag) from the packages a previous
# "ownCloud CI" run built, so no rebuild is needed. Triggered manually.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v7.5.0; a tag with a hyphen such as v11.0.0-beta1 becomes a pre-release)'
        required: true
        default: 'v7.5.0'
      run_id:
        description: 'ownCloud CI run id to take the packages from'
        required: true
        default: '29095326052'

permissions:
  contents: write # create the tag + release and upload assets
  actions: read # download the CI run's artifacts

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download packages from CI run
        run: gh run download "${{ inputs.run_id }}" -R "$GITHUB_REPOSITORY" --dir packages

      - name: Prepare release assets
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          VER="${TAG#v}"
          mkdir -p assets
          # flatten the artifacts, dropping craft bookkeeping files; the per-file
          # .sha256 files are regenerated below because the assets get renamed
          find packages -type f \
            ! -name 'manifest*.json' ! -name '.craft.shelf' ! -name '*.sha256' \
            -exec cp {} assets/ \;
          cd assets
          for f in *; do
            case "$f" in
              *-Setup.exe) mv "$f" "owncloud.online-client-${VER}-win-x64-Setup.exe" ;;
              # the raw craft installer is only the payload of the Setup: it
              # carries the upstream identity ("ownCloud" / "ownCloud GmbH" in
              # Apps & Features, a Start menu entry pointing at bin\owncloud.exe,
              # no Explorer integration) and is not published
              *.exe)      rm -f -- "$f" ;;
              *.7z)       mv "$f" "owncloud.online-client-${VER}-win-x64.7z" ;;
              *.AppImage) mv "$f" "owncloud.online-client-${VER}-linux-x86_64.AppImage" ;;
              *.dmg)      mv "$f" "owncloud.online-client-${VER}-macos-arm64.dmg" ;;
            esac
          done
          # the Setup is the only Windows installer offered - without it there
          # is nothing to release
          test -f "owncloud.online-client-${VER}-win-x64-Setup.exe" \
            || { echo "::error::Windows Setup (*-Setup.exe) fehlt in den CI-Artefakten"; exit 1; }
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create release
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          VER="${TAG#v}"
          # Tag auf genau den Commit setzen, aus dem die Pakete gebaut wurden,
          # nicht pauschal auf master: eine Beta aus release/* oder ein
          # inzwischen weitergelaufener master zeigte sonst auf anderen Code
          TARGET="$(gh run view "${{ inputs.run_id }}" -R "$GITHUB_REPOSITORY" --json headSha -q .headSha)"
          test -n "$TARGET" || { echo "::error::Commit des CI-Laufs ${{ inputs.run_id }} nicht ermittelbar"; exit 1; }
          # Tags mit Bindestrich (z. B. v11.0.0-beta1) sind Vorabversionen und
          # werden als Pre-release angelegt. So bleibt releases/latest beim
          # letzten stabilen Release; Clients bis 11.0.0-beta1 fragen noch
          # releases/latest/download/... ab. Neuere Clients lesen den festen
          # Ablageort (Release "update-feed", siehe update-feed.yml).
          PRERELEASE=()
          BETA_KOPF=""
          BETA_FUSS=""
          case "$VER" in
            *-*)
              PRERELEASE=(--prerelease)
              BETA_KOPF=$'> **Beta – nicht für den Produktivbetrieb.**\n\n'
              BETA_FUSS=$'\n**Bekannte Einschränkung**\n- Deinstallations-Helfer: ein kleiner Rest (Helfer-Ordner) wird beim nächsten Neustart entfernt; stille Deinstallation meldet 3010.\n'
              ;;
          esac
          cat > notes.md <<EOF
          ${BETA_KOPF}Release ${VER} des owncloud.online Desktop-Clients.

          **Pakete**
          - \`owncloud.online-client-${VER}-win-x64-Setup.exe\` — **Windows-Installer**: beendet einen laufenden owncloud.online-Client, installiert, richtet die Explorer-Integration ein und bietet den dafür nötigen Windows-Neustart an. Still (\`/S\`, z. B. baramundi/Intune): startet Windows **nicht** mehr selbst neu – Exit-Code 3010 bedeutet „installiert, Neustart ausstehend“, 0 „nichts ausstehend“; \`/S /forcerestart\` (neu, optional) startet sofort neu; \`/S /norestart\` wird weiterhin angenommen und verhält sich wie \`/S\`. Ein in \`C:\\Program Files\\ownCloud\` installierter offizieller ownCloud-Client wird nicht mehr angefasst.
          - \`owncloud.online-client-${VER}-win-x64.7z\` — Windows portabel
          - \`owncloud.online-client-${VER}-linux-x86_64.AppImage\` — Linux
          - \`owncloud.online-client-${VER}-macos-arm64.dmg\` — macOS (Apple Silicon), mit der Developer ID der BW-Tech GmbH signiert und von Apple notarisiert
          - \`SHA256SUMS.txt\` — Prüfsummen aller Pakete

          Änderungsdetails: siehe \`changelog/\` im Repository. Virtuelle Dateien gibt es derzeit unter Windows; unter macOS und Linux synchronisiert der Client im klassischen Modus mit Ordnerauswahl.
          ${BETA_FUSS}
          EOF
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            "${PRERELEASE[@]}" \
            --title "owncloud.online Client ${VER}" \
            --notes-file notes.md \
            assets/*

  # Ein mit dem GITHUB_TOKEN angelegtes Release startet keinen
  # "release: published"-Lauf, daher den Update-Feed hier direkt erzeugen:
  # für stabile Releases UND Vorabversionen, am Release selbst und am festen
  # Ablageort (Release "update-feed").
  sign-macos:
    needs: publish
    uses: ./.github/workflows/macos-sign-release.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit

  update-feed:
    needs: publish
    permissions:
      contents: write # Feed-Dateien an die Releases hängen, Ablage-Release anlegen
    uses: ./.github/workflows/update-feed.yml
    with:
      tag: ${{ inputs.tag }}
