# Update-Feed des Desktop-Clients: erzeugt je Plattform und Kanal eine
# XML-Datei (Format von src/gui/updater/updateinfo.cpp) und legt sie am festen
# Ablageort ab, dem dauerhaften Release "update-feed" (Vorabversion, nie
# "Latest"):
#   https://github.com/BWTECH-github/client/releases/download/update-feed/owncloud.online-update-<plattform>-<kanal>.xml
# Stabile Releases schreiben die stable- UND die beta-Dateien, Vorabversionen nur
# die beta-Dateien. Ein Lauf für ein älteres Release setzt den Feed nicht zurück
# (--keep-newer), außer mit allow_older (Release bewusst zurückziehen).
# Zusätzlich hängen die Dateien wie bisher am Release selbst; darüber finden
# Clients, die noch .../releases/latest/download/ abfragen (11.0.0-beta1), das
# nächste stabile Release.
# Format, Adressen, Kanäle und was der Client dafür braucht: admin/release/UPDATE-FEED.md
#
# Auslöser:
# - release: published – nur, wenn ein Mensch (oder ein persönliches Token) das
#   Release veröffentlicht. Releases, die publish-release.yml mit dem
#   GITHUB_TOKEN anlegt, starten KEINEN Workflow (Regel von GitHub); dafür ruft
#   publish-release.yml diesen Workflow per workflow_call auf. GitHub nimmt bei
#   diesem Auslöser die Workflow-Datei aus dem getaggten Commit.
# - workflow_dispatch / workflow_call mit dem Tag: Feed (neu) erzeugen, z. B. für
#   ein Release, dessen Tag älter als dieser Workflow ist.
name: Update feed

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag, z. B. v7.11.1'
        required: true
        type: string
      allow_older:
        description: 'Auch eine ältere Version an den festen Ablageort schreiben (Release zurückziehen)'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        description: 'Release-Tag, z. B. v7.11.1'
        required: true
        type: string

permissions:
  contents: write # Feed-Dateien an die Releases hängen, Ablage-Release anlegen

jobs:
  feed:
    # das Ablage-Release selbst ist kein Client-Release
    if: ${{ (inputs.tag || github.event.release.tag_name) != 'update-feed' }}
    runs-on: ubuntu-latest
    # Alle Läufe schreiben in dasselbe Ablage-Release: nacheinander, nicht
    # ineinander (Lesen, Vergleichen, --clobber). Achtung: GitHub hält je Gruppe
    # nur EINEN wartenden Lauf; ein dritter verdrängt den wartenden, der dann
    # von Hand nachzuholen ist (siehe UPDATE-FEED.md).
    concurrency:
      group: update-feed-ablage
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      FEED_TAG: update-feed
      ALLOW_OLDER: ${{ inputs.allow_older && 'true' || 'false' }}
    steps:
      - name: Check out the generator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Self-test the generator
        run: python3 -B admin/release/test_make_update_feed.py -v

      - name: Make sure the fixed location exists
        run: |
          set -euo pipefail
          if gh release view "$FEED_TAG" -R "$GITHUB_REPOSITORY" --json isPrerelease,isDraft > feed-release.json 2>/dev/null; then
            # nie Entwurf (Adresse liefert dann nichts) und nie "Latest"
            # (releases/latest zeigte sonst auf die Ablage statt auf ein Release)
            if [ "$(jq -r '.isPrerelease and (.isDraft | not)' feed-release.json)" != "true" ]; then
              gh release edit "$FEED_TAG" -R "$GITHUB_REPOSITORY" --prerelease --draft=false --latest=false
            fi
          else
            DEFAULT_BRANCH=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
            gh release create "$FEED_TAG" -R "$GITHUB_REPOSITORY" \
              --target "$DEFAULT_BRANCH" --prerelease --latest=false \
              --title "Update-Feed (kein Client-Release)" \
              --notes "Fester Ablageort der Update-Feeds des owncloud.online Desktop-Clients. Wird von .github/workflows/update-feed.yml bei jedem Release aktualisiert. Bitte nicht löschen; die Pakete liegen an den jeweiligen Releases."
          fi

      - name: Fetch the current feed files
        run: |
          set -euo pipefail
          mkdir -p current
          # ein Fehler hier bricht ab, statt den Feed ungeprüft zurückzusetzen
          gh release view "$FEED_TAG" -R "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name | select(startswith("owncloud.online-update-") and endswith(".xml"))' > current.txt
          if [ -s current.txt ]; then
            gh release download "$FEED_TAG" -R "$GITHUB_REPOSITORY" -p 'owncloud.online-update-*.xml' -D current --clobber
          fi
          ls -la current

      - name: Generate the feed files
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Unerwarteter Tag '$TAG' (erwartet z. B. v7.11.1 oder v11.0.0-rc1)"
            exit 1
          fi
          VER="${TAG#v}"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url,assets > release.json
          asset_url() { jq -r --arg name "$1" '.assets[] | select(.name == $name) | .url' release.json; }

          # Paketnamen wie in publish-release.yml ("Prepare release assets")
          platforms=()
          setup=$(asset_url "owncloud.online-client-${VER}-win-x64-Setup.exe")
          if [ -n "$setup" ]; then
            platforms+=(--platform "win-x64=$setup")
          else
            echo "::warning::Kein Windows-Setup im Release $TAG, daher kein Feed für win-x64"
          fi
          if [ -n "$(asset_url "owncloud.online-client-${VER}-linux-x86_64.AppImage")" ]; then
            # mit zsync-Datei aktualisiert sich das AppImage selbst, sonst nur Hinweis mit Link
            zsync=$(asset_url "owncloud.online-client-${VER}-linux-x86_64.AppImage.zsync")
            platforms+=(--platform "linux-x86_64${zsync:+=$zsync}")
          else
            echo "::warning::Kein AppImage im Release $TAG, daher kein Feed für linux-x86_64"
          fi
          if [ -n "$(asset_url "owncloud.online-client-${VER}-macos-arm64.dmg")" ]; then
            platforms+=(--platform macos-arm64)
          else
            echo "::warning::Kein dmg im Release $TAG, daher kein Feed für macos-arm64"
          fi
          if [ ${#platforms[@]} -eq 0 ]; then
            echo "::error::Release $TAG enthält keines der Pakete aus publish-release.yml"
            exit 1
          fi

          common=(--tag "$TAG" --web "$(jq -r .url release.json)" "${platforms[@]}")
          # alle Dateien für das Release selbst
          python3 -B admin/release/make-update-feed.py "${common[@]}" --out feed
          # für den festen Ablageort nur, was dort nichts Neueres ersetzt
          mkdir -p feed-ablage
          if [ "$ALLOW_OLDER" = "true" ]; then
            echo "::warning::allow_older: der feste Ablageort bekommt $TAG auch dann, wenn dort Neueres liegt"
            python3 -B admin/release/make-update-feed.py "${common[@]}" --out feed-ablage
          else
            python3 -B admin/release/make-update-feed.py "${common[@]}" --out feed-ablage --keep-newer current
          fi
          for file in feed/*.xml; do
            echo "::group::$file"
            cat "$file"
            echo "::endgroup::"
          done

      - name: Attach the feed files to the release itself
        run: gh release upload "$TAG" feed/*.xml --clobber -R "$GITHUB_REPOSITORY"

      - name: Upload to the fixed location
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(feed-ablage/*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::notice::Am festen Ablageort liegt für jede Datei eine neuere Version als $TAG; nichts ersetzt."
            exit 0
          fi
          gh release upload "$FEED_TAG" "${files[@]}" --clobber -R "$GITHUB_REPOSITORY"

      - name: Check what the fixed location serves
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in feed-ablage/*.xml; do
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$FEED_TAG/$(basename "$file")"
            for attempt in 1 2 3; do
              if curl -fsSL --proto '=https' "$url" -o served.xml && cmp -s served.xml "$file"; then
                echo "ok: $url"
                continue 2
              fi
              echo "Versuch $attempt: $url liefert (noch) nicht die neue Datei"
              sleep 10
            done
            echo "::error::$url liefert nicht die eben abgelegte Datei"
            exit 1
          done
